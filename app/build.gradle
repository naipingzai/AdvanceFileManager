apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

apply from: '../signing.gradle'

android {
    namespace = 'com.advancefilemanager'
    buildToolsVersion = '36.0.0'
    compileSdk = 36
    ndkVersion = '28.1.13356709'
    defaultConfig {
        applicationId 'com.advancefilemanager'
        minSdk = 21
        targetSdk = 35
        versionCode = 1
        versionName = '1.0.0'
        resValue 'string', 'app_version', versionName + ' (' + versionCode + ')'
        buildConfigField 'String', 'FILE_PROVIDER_AUTHORITY', 'APPLICATION_ID + ".file_provider"'
        resValue 'string', 'app_provider_authority', applicationId + '.app_provider'
        resValue 'string', 'file_provider_authority', applicationId + '.file_provider'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildFeatures {
        aidl = true
        buildConfig = true
        viewBinding = true
    }
    androidResources {
        generateLocaleConfig = true
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }
    lint {
        // For "Invalid package reference in library; not included in Android: javax.security.sasl.
        // Referenced from org.apache.mina.proxy.ProxyAuthException."
        warning 'InvalidPackage', 'MissingTranslation'
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'org/bouncycastle/pqc/crypto/picnic/*'
            ]
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
}

repositories {
    file("$rootDir/prebuild/android").listFiles()?.findAll { it.isDirectory() }?.each { dir ->
        flatDir { dirs dir }
    }
}

dependencies {
    // --- Local JARs (materialfile_deps source builds) ---
    implementation files(
            '../prebuild/android/dav4jvm/advancefilemanager-dav4jvm.jar',
            '../prebuild/android/okhttp/advancefilemanager-okhttp.jar',
            '../prebuild/android/okio/advancefilemanager-okio.jar'
    )

    // --- Local AARs (materialfile_deps source builds) ---
    implementation(name: 'advancefilemanager-photoview', ext: 'aar')
    implementation(name: 'advancefilemanager-libsu-service', ext: 'aar')
    implementation(name: 'advancefilemanager-libsu-core', ext: 'aar')
    implementation(name: 'advancefilemanager-speed-dial', ext: 'aar')
    implementation(name: 'advancefilemanager-subsampling', ext: 'aar')
    implementation(name: 'advancefilemanager-licensesdialog', ext: 'aar')
    implementation(name: 'advancefilemanager-coil', ext: 'aar')
    implementation(name: 'advancefilemanager-coil-base', ext: 'aar')
    implementation(name: 'advancefilemanager-coil-gif', ext: 'aar')
    implementation(name: 'advancefilemanager-coil-svg', ext: 'aar')
    implementation(name: 'advancefilemanager-coil-video', ext: 'aar')
    implementation(name: 'advancefilemanager-preferencex', ext: 'aar')
    implementation(name: 'advancefilemanager-simplemenu', ext: 'aar')
    implementation(name: 'advancefilemanager-advrecyclerview', ext: 'aar')
    implementation(name: 'advancefilemanager-materialshadownp', ext: 'aar')
    implementation(name: 'advancefilemanager-insetter-ktx', ext: 'aar')
    implementation(name: 'advancefilemanager-insetter', ext: 'aar')
    implementation(name: 'advancefilemanager-shizuku-api', ext: 'aar')
    implementation(name: 'advancefilemanager-shizuku-shared', ext: 'aar')
    implementation(name: 'advancefilemanager-shizuku-aidl', ext: 'aar')
    implementation(name: 'advancefilemanager-androidsvg', ext: 'aar')
    implementation(name: 'advancefilemanager-drawer', ext: 'aar')

    // --- Official dependencies (Google / JetBrains / AndroidX) ---
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    def kotlinx_coroutines_version = '1.10.2'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinx_coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinx_coroutines_version"

    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.8'
    def media3_version = '1.2.1'
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    def androidx_lifecycle_version = '2.9.2'
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$androidx_lifecycle_version"
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Libraries embedded as source code (advancefilemanager.lib.*):
    // appiconloader, fastscroll, foregroundcompat, systemuihelper
    // JNI libraries (all prebuilt in prebuild/):
    // libarchive, libselinux, bzip2, xz, lz4, zstd, mbedtls, pcre2
    // AndroidRetroFile embedded as source (java8.nio.*)

    // --- Test dependencies ---
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.truth:truth:1.4.4'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "androidx.test.ext:junit:1.2.1"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$kotlinx_coroutines_version"

    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation 'com.google.truth:truth:1.4.4'
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-intents:3.6.1"
    androidTestImplementation "androidx.fragment:fragment-testing:1.8.8"
}
